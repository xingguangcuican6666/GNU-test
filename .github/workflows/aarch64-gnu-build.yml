name: AArch64 GNU Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-aarch64-gnu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make

      - name: Build hello world for AArch64 GNU
        run: make clean all

      - name: Upload AArch64 GNU artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-aarch64
          path: hello-aarch64
          if-no-files-found: error
